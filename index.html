<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบ POS ร้านอาหารครบวงจร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff9fb;--card:#fff;--ink:#2b1a22;--mute:#7a6670;--line:#f6dfe8;--pk:#f7a8c4;--pk-ink:#4a1030;--pkd:#b3205f;--soft:#fdeff4;--ok:#1b7f55;--bad:#c0392b;--warn:#d97706;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1217;--card:#2a1a21;--ink:#fbeaf1;--mute:#b79aa8;--line:#4a2d38;--pk:#ee5a92;--pk-ink:#2b0f1b;--soft:#3d2230;--ok:#58d19b;--bad:#ff8a7a;--warn:#fbbf24;--pkd:#f58db5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1217;--card:#2a1a21;--ink:#fbeaf1;--mute:#b79aa8;--line:#4a2d38;--pk:#ee5a92;--pk-ink:#2b0f1b;--soft:#3d2230;--ok:#58d19b;--bad:#ff8a7a;--warn:#fbbf24;--pkd:#f58db5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Prompt,"Noto Sans Thai",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:46px;transition:transform .05s}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pkd);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
[hidden]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--pk);color:var(--pk-ink);flex-wrap:wrap;box-shadow:0 2px 10px rgba(74,16,48,.08)}
h1{font-size:22px;margin:0;font-weight:600}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;color:inherit;border-color:rgba(74,16,48,.3);position:relative;padding:8px 12px;font-size:15px}
nav button.on{background:var(--card);color:var(--pkd);border-color:var(--card);font-weight:600}
.kds-badge{background:var(--bad);color:#fff;font-size:12px;font-weight:600;padding:1px 7px;border-radius:12px;margin-left:4px;vertical-align:middle}
main{padding:16px;max-width:1340px;margin:0 auto}
.split2{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media(max-width:920px){.split2{grid-template-columns:1fr}}
h2{font-size:19px;margin:0 0 10px;font-weight:600}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-bottom:14px}
.tb{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 12px;position:relative}
.tb small{color:var(--mute);font-size:13px}
.tb.busy{background:var(--soft);border-color:var(--pk)}
.tb.on{background:var(--pk);color:var(--pk-ink);border-color:var(--pk)}
.tb.on small{color:inherit}
.dot{width:9px;height:9px;border-radius:50%;position:absolute;top:10px;right:10px;background:var(--ok)}
.tb.busy .dot{background:var(--bad)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cats button.on{background:var(--soft);border-color:var(--pk);font-weight:600}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.mi{text-align:left;padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;font-weight:500;position:relative}
.mi span{color:var(--pkd);font-weight:600}
.mi:active{background:var(--soft)}
.mi.soldout{opacity:.55;background:var(--bg);border-style:dashed}
.so-tag{background:var(--bad);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;display:inline-block;margin-bottom:4px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.bill{position:sticky;top:12px}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ln.two{grid-template-columns:1fr auto}
.q{display:flex;align-items:center;gap:6px}
.q button{padding:0;width:36px;min-height:36px;font-size:18px}
.mute{color:var(--mute)}
.empty{color:var(--mute);padding:16px 0;text-align:center}
.sum{margin:10px 0;display:grid;gap:4px}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-size:24px;font-weight:600;border-top:2px solid var(--line);padding-top:8px;margin-top:4px;color:var(--pkd)}
.opts{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
input,select{padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);width:100%;min-height:46px}
.opts input[type=number]{width:110px}
.opts input[type=checkbox]{width:26px;min-height:26px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row>*{flex:1}
.pri{background:var(--pk);color:var(--pk-ink);border-color:var(--pk);font-weight:600}
.ok-btn{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600}
.warn-btn{background:var(--warn);color:#fff;border-color:var(--warn);font-weight:600}
.bad-btn{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(40,10,25,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.box{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto;border:1.5px solid var(--line)}
.big{font-size:38px;font-weight:600;color:var(--pkd);margin:4px 0 12px}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:100px}
.seg button.on{background:var(--pk);color:var(--pk-ink);border-color:var(--pk);font-weight:600}
.quick{display:flex;gap:6px;margin:8px 0}
.quick button{flex:1;padding:6px}
label{display:block;margin:8px 0 4px;color:var(--mute);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th,.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl th{color:var(--mute);font-weight:500}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:25px;font-weight:600;margin-top:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-top:16px}
.cols .card{overflow-x:auto}
.bar{height:12px;border-radius:6px;background:var(--soft);margin:4px 0 2px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--pk)}
.mi img{width:100%;height:78px;object-fit:cover;border-radius:8px;margin-bottom:6px}
.th{width:44px;height:44px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px;background:var(--soft)}
.logo{height:42px;max-width:120px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.brand{display:flex;align-items:center;gap:10px}
.pv{max-width:130px;max-height:130px;border-radius:10px;display:block;margin:6px 0}
.pct{display:flex;gap:6px}.pct button{flex:1;padding:4px;min-height:38px}

/* สถานะ 3 ระดับในครัว (รอทำ / กำลังทำ / เสิร์ฟแล้ว) + ยกเลิก 2 รอบ */
.kds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.kds-card{background:var(--card);border:2px solid var(--bad);border-radius:16px;overflow:hidden}
.kds-card.cooking{border-color:var(--warn)}
.kds-card.done{border-color:var(--ok);opacity:.88}
.kds-hd{padding:12px 16px;background:var(--soft);display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid var(--line)}
.kds-item{display:flex;flex-direction:column;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
.kds-item:last-child{border-bottom:0}
.kds-item.st-done{background:var(--bg)}
.kds-item.st-done .item-title{text-decoration:line-through;color:var(--mute)}
.tag-status{font-size:12px;padding:3px 9px;border-radius:12px;font-weight:600;display:inline-block}
.st-wait{background:#fee2e2;color:#991b1b}
.st-cook{background:#fef3c7;color:#92400e}
.st-done{background:#d1fae5;color:#065f46}
.note-txt{font-size:13px;color:var(--bad);margin-top:2px;font-weight:500}

/* จอแสดงผลฝั่งลูกค้า (Customer Display - เงินสด / สแกนจ่าย) */
.disp-layout{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
@media(max-width:860px){.disp-layout{grid-template-columns:1fr}}
.disp-total-box{background:var(--soft);border:2px solid var(--pk);border-radius:16px;padding:18px;text-align:center;margin-top:12px}
.disp-total-box .amt{font-size:44px;font-weight:600;color:var(--pkd);line-height:1.1}
.cash-summary-box{background:var(--bg);border:2px solid var(--ok);border-radius:16px;padding:22px;text-align:center}
.cash-row{display:flex;justify-content:space-between;font-size:22px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cash-change{font-size:38px;font-weight:600;color:var(--ok);margin-top:12px}

/* ใบเสร็จ & QR ขนาดใหญ่ */
#rcpt .hd img{height:52px;max-width:140px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;margin-bottom:4px}
#rcpt{background:#fff;color:#000;font-size:16px;line-height:1.5;margin:0 auto;padding:0 0 12px;border:1px dashed #d9a6bb}
#rcpt .hd{background:#fbc9da;color:#4a1030;text-align:center;padding:12px 8px}
#rcpt .hd b{font-size:22px;display:block}
#rcpt .bd{padding:8px 12px}
#rcpt .r{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
#rcpt hr{border:0;border-top:1px dashed #888;margin:8px 0}
#rcpt .t{font-size:20px;font-weight:600}
#rcpt .ty{text-align:center;margin-top:8px}
.qr-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:12px 0;padding:16px;background:#fff;border-radius:16px;border:2px dashed var(--pk)}
.qr-wrap img,.qr-wrap canvas{max-width:250px!important;max-height:250px!important;width:250px!important;height:250px!important;object-fit:contain}
.badge{background:var(--card);color:var(--pkd);padding:4px 12px;border-radius:20px;font-weight:600;font-size:15px}
.cust-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1.5px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:15;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
#v-cust{padding-bottom:95px}
@media print{
 @page{margin:0}
 body *{visibility:hidden}
 #rcpt,#rcpt *{visibility:visible}
 #rcpt{position:absolute;left:0;top:0;border:0;margin:0}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img id="logo" class="logo" alt="" hidden>
    <div>
      <h1 id="shopName"></h1>
      <small id="sync"></small>
    </div>
  </div>
  <nav id="main-nav">
    <button id="t-ord" class="on" onclick="tab('ord')">1. รับออเดอร์</button>
    <button id="t-kds" onclick="tab('kds')">2. ครัว (KDS) <span id="kds-cnt" class="kds-badge" hidden>0</span></button>
    <button id="t-pay" onclick="tab('pay')">3. คิดเงิน</button>
    <button id="t-disp" onclick="tab('disp')">4. จอลูกค้า</button>
    <button id="t-menu" onclick="tab('menu')">5. เมนู & QR โต๊ะ</button>
    <button id="t-rep" onclick="tab('rep')">6. รายงาน DBD</button>
    <button id="t-out" hidden onclick="logoutSystem()">ออกจากระบบ</button>
  </nav>
  <div id="cust-badge" class="badge" hidden></div>
</header>

<main id="v-ord"></main>
<main id="v-kds" hidden></main>
<main id="v-pay" hidden></main>
<main id="v-disp" hidden></main>
<main id="v-menu" hidden></main>
<main id="v-rep" hidden></main>
<main id="v-cust" hidden></main>

<div id="modal" class="modal" hidden><div class="box" id="box"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const DEF=[
[1,"กะเพราหมูสับไข่ดาว",60,22,"จานเดียว",false],[2,"ข้าวผัดกุ้ง",80,30,"จานเดียว",false],[3,"ผัดไทยกุ้งสด",90,32,"จานเดียว",false],[4,"ข้าวมันไก่",55,20,"จานเดียว",false],
[5,"ผัดผักบุ้งไฟแดง",70,22,"กับข้าว",false],[6,"ทอดมันปลากราย",100,38,"กับข้าว",false],[7,"คั่วกลิ้งหมู",85,30,"กับข้าว",false],
[8,"ต้มยำกุ้ง",150,60,"ต้ม/ยำ",false],[9,"ต้มข่าไก่",120,45,"ต้ม/ยำ",false],[10,"ส้มตำไทย",60,18,"ต้ม/ยำ",false],[11,"ยำวุ้นเส้น",90,32,"ต้ม/ยำ",false],
[12,"ชาไทยเย็น",40,9,"เครื่องดื่ม",false],[13,"มะนาวโซดา",35,8,"เครื่องดื่ม",false],[14,"น้ำเปล่า",15,4,"เครื่องดื่ม",false],
[15,"ข้าวเหนียวมะม่วง",90,35,"ของหวาน",false],[16,"บัวลอย",50,15,"ของหวาน",false]
].map(([id,name,price,cost,cat,soldOut])=>({id,name,price,cost,cat,soldOut}));

let S={
  orders:{},
  sales:[],
  seq:1,
  nid:100,
  tl:["1","2","3","4","5","6","7","8","T"],
  tnames:{},
  tid:1,
  menu:DEF,
  displayState:{table:"1",method:"qr",received:0,paidSuccess:false},
  shop:{name:"ครัวพริกไทย",info:"โทร 02-000-0000",pw:80,logo:"",payQr:"",vat:"in"}
};

try{
  const r=JSON.parse(localStorage.getItem("pos-v2")||"null");
  if(r){
    S=Object.assign(S,r);
    if(!S.displayState)S.displayState={table:"1",method:"qr",received:0,paidSuccess:false};
  }
}catch(e){}

const URL_PARAMS=new URLSearchParams(window.location.search);
const CUST_TABLE=URL_PARAMS.get("table");
const IS_CUST=!!CUST_TABLE;
const IS_DISP_WINDOW=URL_PARAMS.get("display")==="1";

let isDemoMode=false;
let isSubmittingOrder=false;
let waiterDraft={};
let custCart={};
let custNotes={};
let kdsFilter="all";
let kdsCancelConfirm={};
let curTab="ord";

const save=()=>{try{localStorage.setItem("pos-v2",JSON.stringify(S))}catch(e){}fbPush()};
let ordTable=CUST_TABLE||"1";
let payTable=S.displayState.table||"1";
let cat="ทั้งหมด",range="day",delId=0,wipe=false;

const $=id=>document.getElementById(id);
const fmt=n=>"฿"+(Math.round(n*100)/100).toLocaleString("en-US");
const tn=t=>S.tnames[t]||(t==="T"?"กลับบ้าน":"โต๊ะ "+t);
const hm=iso=>new Date(iso).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
const pid=n=>"#"+String(n).padStart(4,"0");
const ord=t=>{
  if(!S.orders[t])S.orders[t]={items:{},disc:0,svc:false,notes:{},status:{}};
  if(!S.orders[t].items)S.orders[t].items={};
  if(!S.orders[t].notes)S.orders[t].notes={};
  if(!S.orders[t].status)S.orders[t].status={};
  return S.orders[t];
};
const byId=id=>S.menu.find(m=>m.id==id);
const cats=()=>["ทั้งหมด",...new Set(S.menu.map(m=>m.cat))];

function calc(o){
  let sub=0,cnt=0,cost=0;
  for(const id in o.items){
    const m=byId(id);
    if(!m){delete o.items[id];continue}
    sub+=m.price*o.items[id];
    cost+=m.cost*o.items[id];
    cnt+=o.items[id];
  }
  const disc=o.dt==="p"?Math.round(sub*Math.min(o.disc||0,100))/100:Math.min(o.disc||0,sub);
  const svc=o.svc?Math.round((sub-disc)*10)/100:0;
  const base=sub-disc+svc;
  const vm=S.shop.vat||"in";
  const vat=vm==="none"?0:vm==="add"?Math.round(base*7)/100:base*7/107;
  const total=base+(vm==="add"?vat:0);
  return{sub,cnt,cost,disc,svc,total,vat,vm};
}

function updateKdsBadge(){
  let pending=0;
  for(const t in S.orders){
    const o=S.orders[t];
    if(!o||!o.items)continue;
    for(const id in o.items){
      const st=(o.status&&o.status[id])||"wait";
      if(o.items[id]>0 && st!=="done") pending++;
    }
  }
  const b=$("kds-cnt");
  if(b){b.hidden=pending===0;b.textContent=pending}
}

function tab(t){
  if(IS_CUST)return;
  curTab=t;
  ["ord","kds","pay","disp","menu","rep"].forEach(x=>{
    $("v-"+x).hidden=x!==t;
    if($("t-"+x))$("t-"+x).className=x===t?"on":"";
  });
  if(t==="ord")rOrd();
  if(t==="kds")rKds();
  if(t==="pay")rPay();
  if(t==="disp")rDisp();
  if(t==="menu")rMgr();
  if(t==="rep")rRep();
}

/* ==================== สลับสถานะเมนูหมด (Sold Out) ==================== */
function toggleSoldOut(id){
  const m=byId(id);
  if(!m)return;
  m.soldOut=!m.soldOut;
  save();
  if(curTab==="menu")rMgr();
  if(curTab==="ord")rOrd();
  if(!$("modal").hidden && $("so-modal-list"))openQuickSoldOutModal();
}

function openQuickSoldOutModal(){
  $("box").innerHTML=`
    <h2>จัดการสถานะเมนู (พร้อมขาย / หมดชั่วคราว)</h2>
    <p class="mute" style="margin-top:0">กดปุ่มเพื่อปิดหรือเปิดเมนู เมนูที่ปิดจะแสดงป้าย <b>SOLD OUT</b> ทั้งหน้าพนักงานและหน้าจอมือถือลูกค้าทันที</p>
    <div id="so-modal-list" style="max-height:55vh;overflow:auto">
      ${S.menu.map(m=>`
        <div class="ln two" style="padding:8px 0">
          <span><b>${m.name}</b><br><small class="mute">${m.cat} • ${fmt(m.price)}</small></span>
          <button onclick="toggleSoldOut(${m.id})" class="${m.soldOut?"bad-btn":"ok-btn"}" style="min-height:38px;padding:4px 12px;font-size:14px">
            ${m.soldOut?"🔴 หมด (Sold Out)":"🟢 พร้อมขาย"}
          </button>
        </div>
      `).join("")}
    </div>
    <div class="row"><button class="pri" onclick="closeM()">เสร็จสิ้น</button></div>`;
  $("modal").hidden=false;
}

/* ==================== 1. หน้าจอรับออเดอร์ (พนักงานเสิร์ฟ - แก้บั๊กสั่ง 1 ไป 2 แล้ว) ==================== */
function pickOrdTable(t){ordTable=t;rOrd()}
function setOrdCat(c){cat=c;rOrd()}
function addDraft(id){
  const m=byId(id);
  if(!m||m.soldOut)return;
  if(!waiterDraft[ordTable])waiterDraft[ordTable]={};
  const d=waiterDraft[ordTable][id]||{qty:0,note:""};
  d.qty+=1;
  waiterDraft[ordTable][id]=d;
  rOrd();
}
function chgDraft(id,delta){
  if(!waiterDraft[ordTable]||!waiterDraft[ordTable][id])return;
  waiterDraft[ordTable][id].qty+=delta;
  if(waiterDraft[ordTable][id].qty<=0)delete waiterDraft[ordTable][id];
  rOrd();
}
function noteDraft(id){
  if(!waiterDraft[ordTable]||!waiterDraft[ordTable][id])return;
  const m=byId(id);
  const val=prompt(`หมายเหตุถึงครัวสำหรับ "${m.name}" (เช่น ไม่เผ็ด, แยกน้ำ):`,waiterDraft[ordTable][id].note||"");
  if(val!==null){
    waiterDraft[ordTable][id].note=val.trim();
    rOrd();
  }
}

function submitWaiterOrder(){
  if(isSubmittingOrder)return;
  const draft=waiterDraft[ordTable]||{};
  const ids=Object.keys(draft);
  if(!ids.length)return;

  isSubmittingOrder=true;
  const targetT=ordTable;
  const btn=$("btn-waiter-send");
  if(btn){btn.disabled=true;btn.textContent="กำลังส่งออเดอร์..."}

  const applyOrder=(curr)=>{
    const o=curr||{items:{},disc:0,svc:false,notes:{},status:{}};
    o.items=o.items||{};
    o.notes=o.notes||{};
    o.status=o.status||{};
    if(!o.start)o.start=new Date().toISOString();
    ids.forEach(id=>{
      o.items[id]=(o.items[id]||0)+draft[id].qty;
      o.status[id]="wait";
      if(draft[id].note){
        o.notes[id]=o.notes[id]?(o.notes[id]+", "+draft[id].note):draft[id].note;
      }
    });
    return o;
  };

  const doneSubmit=()=>{
    delete waiterDraft[targetT];
    isSubmittingOrder=false;
    rOrd();
    alert(`ส่งออเดอร์ของ ${tn(targetT)} เข้าหน้าจอในครัวเรียบร้อยแล้ว!`);
  };

  // ใช้ Transaction ตัวเดียวเมื่อออนไลน์ Firebase (ไม่เรียก save() ซ้ำซ้อน ป้องกันเบิ้ล 100%)
  if(fbOn&&fb){
    fb.ref("orders/"+targetT).transaction(curr=>applyOrder(curr))
      .then(()=>doneSubmit())
      .catch(()=>{
        isSubmittingOrder=false;
        rOrd();
        alert("ส่งออเดอร์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
      });
  }else{
    S.orders[targetT]=applyOrder(S.orders[targetT]);
    save();
    doneSubmit();
  }
}

  const draftIds=Object.keys(draft);
  const sentIds=Object.keys(o.items);

  $("v-ord").innerHTML=`

        <div style="display:flex;gap:8px;align-items:center">
          <small class="mute">🟢 ว่าง | 🔴 มีลูกค้า</small>

      <div class="tables">
        ${S.tl.map(t=>{

            <span class="dot"></span>

          </button>`;
        }).join("")}
      </div>

      <div class="cats">${cats().map(c=>`<button class="${c===cat?"on":""}" onclick="setOrdCat('${c}')">${c}</button>`).join("")}</div>
      <div class="menu">
        ${S.menu.filter(m=>cat==="ทั้งหมด"||m.cat===cat).map(m=>`
          <button class="mi ${m.soldOut?"soldout":""}" onclick="addDraft(${m.id})" ${m.soldOut?"disabled":""}>
            ${m.img?`<img src="${m.img}" alt="">`:""}

        <button onclick="openQR('${ordTable}')" style="min-height:36px;padding:4px 10px;font-size:13px">📱 QR โต๊ะนี้</button>
      </div>

      <div style="background:var(--soft);padding:12px;border-radius:12px;margin-bottom:14px">
        <div style="font-weight:600;color:var(--pkd);margin-bottom:6px">รายการที่กำลังจะส่งเข้าครัว (${draftIds.reduce((a,id)=>a+draft[id].qty,0)})</div>
        ${draftIds.length ? draftIds.map(id=>{
          const m=byId(id);if(!m)return"";
          const d=draft[id];
          return `<div class="ln two" style="padding:6px 0">
            <span>
              <b>${m.name}</b>
              ${d.note?`<div class="note-txt">* ${d.note}</div>`:""}
              <div><button onclick="noteDraft(${id})" style="min-height:26px;padding:1px 8px;font-size:12px;margin-top:4px">+ หมายเหตุครัว</button></div>
            </span>
            <span class="q">
              <button onclick="chgDraft(${id},-1)">−</button>
              <b>${d.qty}</b>
              <button onclick="chgDraft(${id},1)">+</button>
            </span>
          </div>`;
        }).join("") : '<div class="empty" style="padding:10px 0;font-size:15px">แตะเมนูด้านซ้ายเพื่อเพิ่มรายการสั่ง</div>'}
        <button id="btn-waiter-send" class="ok-btn" style="width:100%;margin-top:10px" onclick="submitWaiterOrder()" ${draftIds.length && !isSubmittingOrder?"":"disabled"}>
          🔔 ส่งออเดอร์เข้าครัวทันที
        </button>
      </div>

      <div>
        <div style="font-weight:600;margin-bottom:6px">รายการที่ส่งเข้าครัวไปแล้ว (${tn(ordTable)})</div>

          const m=byId(id);if(!m)return"";
          const st=(o.status&&o.status[id])||"wait";

/* ==================== 2. หน้าจอในครัว (KDS 3 สถานะ + ยกเลิก 2 รอบ Double-Tap) ==================== */
function setKdsFilter(f){kdsFilter=f;rKds()}
function setItemKdsStatus(t,id,nextStatus){
  const o=ord(t);
  if(!o.status)o.status={};
  o.status[id]=nextStatus;
  save();rKds();
}
function setTableKdsStatus(t,nextStatus){
  const o=ord(t);
  if(!o.status)o.status={};
  for(const id in o.items)o.status[id]=nextStatus;
  save();rKds();
}
function cancelKdsItem(t,id){
  const key=`${t}_${id}`;
  if(!kdsCancelConfirm[key]){
    kdsCancelConfirm[key]=true;
    rKds();
    setTimeout(()=>{
      if(kdsCancelConfirm[key]){
        delete kdsCancelConfirm[key];
        if(curTab==="kds")rKds();
      }
    },4000);
    return;
  }
  delete kdsCancelConfirm[key];
  const o=ord(t);
  delete o.items[id];
  if(o.notes)delete o.notes[id];
  if(o.status)delete o.status[id];
  if(!Object.keys(o.items).length)delete S.orders[t];
  save();rKds();
}

function rKds(){
  const activeTables=S.tl.filter(t=>Object.keys(ord(t).items).length>0);
  let cntWait=0,cntCook=0,cntDone=0;
  activeTables.forEach(t=>{
    const o=ord(t);
    for(const id in o.items){
      const st=(o.status&&o.status[id])||"wait";
      if(st==="wait")cntWait++;
      else if(st==="cook")cntCook++;
      else cntDone++;
    }
  });

  $("v-kds").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div>
        <h2 style="margin:0">หน้าจอแสดงรายการอาหารในครัว (KDS)</h2>
        <small class="mute">ซ่อนราคาทั้งหมด • กดเปลี่ยนสถานะได้ทันที • หากต้องการยกเลิกรายการให้กดปุ่ม "ยกเลิก" 2 รอบ</small>
      </div>
      <div class="seg" style="margin:0">
        <button class="${kdsFilter==="all"?"on":""}" onclick="setKdsFilter('all')">ทั้งหมด (${cntWait+cntCook+cntDone})</button>
        <button class="${kdsFilter==="wait"?"on":""}" onclick="setKdsFilter('wait')">🔴 รอทำ (${cntWait})</button>
        <button class="${kdsFilter==="cook"?"on":""}" onclick="setKdsFilter('cook')">🟡 กำลังทำ (${cntCook})</button>
        <button class="${kdsFilter==="done"?"on":""}" onclick="setKdsFilter('done')">🟢 เสิร์ฟแล้ว (${cntDone})</button>
      </div>
    </div>

    ${activeTables.length===0 ? `<div class="card"><div class="empty" style="padding:40px 0">ไม่มีรายการอาหารค้างในครัวขณะนี้</div></div>` : `
      <div class="kds-grid">
        ${activeTables.map(t=>{
          const o=ord(t);
          const allIds=Object.keys(o.items);
          const filteredIds=allIds.filter(id=>{
            const st=(o.status&&o.status[id])||"wait";
            return kdsFilter==="all" || st===kdsFilter;
          });
          if(!filteredIds.length)return"";

          const isAllDone=allIds.every(id=>((o.status&&o.status[id])||"wait")==="done");
          const isAnyCook=allIds.some(id=>((o.status&&o.status[id])||"wait")==="cook");
          const cardCls=isAllDone?"done":isAnyCook?"cooking":"";
          const headBadge=isAllDone?'<span class="tag-status st-done">🟢 เสิร์ฟครบแล้ว</span>':isAnyCook?'<span class="tag-status st-cook">🟡 กำลังปรุงอาหาร</span>':'<span class="tag-status st-wait">🔴 ออเดอร์ใหม่</span>';

          return `<div class="kds-card ${cardCls}">
            <div class="kds-hd">
              <div>
                <b style="font-size:20px">${tn(t)}</b>
                ${o.start?`<div class="mute" style="font-size:13px">เข้าโต๊ะ ${hm(o.start)} น.</div>`:""}
              </div>
              ${headBadge}
            </div>
            <div>
              ${filteredIds.map(id=>{
                const m=byId(id);if(!m)return"";
                const st=(o.status&&o.status[id])||"wait";
                const note=(o.notes&&o.notes[id])||"";
                const isConfirming=!!kdsCancelConfirm[`${t}_${id}`];
                return `<div class="kds-item st-${st}">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
                    <div class="item-title" style="font-weight:600;font-size:18px">
                      ${m.name} <span style="color:var(--pkd)">x${o.items[id]}</span>
                      ${note?`<div class="note-txt">* หมายเหตุ: ${note}</div>`:""}
                    </div>
                    <button onclick="cancelKdsItem('${t}',${id})" class="${isConfirming?"bad-btn":""}" style="min-height:32px;padding:2px 10px;font-size:12px;white-space:nowrap">
                      ${isConfirming?"⚠️ ยืนยันยกเลิก?":"✕ ยกเลิก"}
                    </button>
                  </div>
                  <div style="display:flex;gap:4px">
                    <button onclick="setItemKdsStatus('${t}',${id},'wait')" style="flex:1;min-height:36px;padding:2px 6px;font-size:13px;${st==='wait'?'background:#fee2e2;border-color:#ef4444;font-weight:600':''}">🔴 รอทำ</button>
                    <button onclick="setItemKdsStatus('${t}',${id},'cook')" style="flex:1;min-height:36px;padding:2px 6px;font-size:13px;${st==='cook'?'background:#fef3c7;border-color:#f59e0b;font-weight:600':''}">🟡 กำลังทำ</button>
                    <button onclick="setItemKdsStatus('${t}',${id},'done')" style="flex:1;min-height:36px;padding:2px 6px;font-size:13px;${st==='done'?'background:#d1fae5;border-color:#10b981;font-weight:600':''}">🟢 เสิร์ฟแล้ว</button>
                  </div>
                </div>`;
              }).join("")}
            </div>
            <div style="padding:10px 16px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:6px">
              <button class="warn-btn" style="flex:1;min-height:38px;padding:4px 8px;font-size:14px" onclick="setTableKdsStatus('${t}','cook')">🟡 กำลังทำทั้งโต๊ะ</button>
              <button class="ok-btn" style="flex:1;min-height:38px;padding:4px 8px;font-size:14px" onclick="setTableKdsStatus('${t}','done')">🟢 เสิร์ฟครบทั้งโต๊ะ</button>
            </div>
          </div>`;
        }).join("")}
      </div>
    `}
  `;
}

/* ==================== 3. หน้าจอคิดเงิน (แคชเชียร์ - เชื่อมตรงกับจอลูกค้า) ==================== */
function pickPayTable(t){
  payTable=t;
  const c=calc(ord(t));
  S.displayState={
    table:t,
    method:S.displayState.method||"qr",
    received:Math.ceil(c.total),
    paidSuccess:false
  };
  save();
  rPay();
}
function setPayMethod(m){
  const c=calc(ord(payTable));
  S.displayState.method=m;
  S.displayState.paidSuccess=false;
  if(m==="cash" && (!S.displayState.received || S.displayState.received<c.total)){
    S.displayState.received=Math.ceil(c.total);
  }
  save();
  rPay();
}
function setCashReceived(val){
  S.displayState.received=Math.max(0,+val||0);
  S.displayState.paidSuccess=false;
  save();
  rPay();
}
function chgPayQty(id,d){
  const o=ord(payTable);
  o.items[id]=(o.items[id]||0)+d;
  if(o.items[id]<=0){
    delete o.items[id];
    if(o.notes)delete o.notes[id];
    if(o.status)delete o.status[id];
  }
  if(!Object.keys(o.items).length)delete o.start;
  save();rPay();
}
function setPayDisc(v){ord(payTable).disc=Math.max(0,+v||0);save();rPay()}
function setPayDt(v){ord(payTable).dt=v;save();rPay()}
function quickPayPct(p){const o=ord(payTable);o.dt="p";o.disc=p;save();rPay()}
function setPaySvc(v){ord(payTable).svc=v;save();rPay()}
function clearPayTable(){delete S.orders[payTable];save();rPay()}
function openCustomerWindow(){
  const u=new URL(window.location.href);
  u.search="";
  u.searchParams.set("display","1");
  window.open(u.toString(),"CustomerDisplay","width=980,height=740");
}

function rPay(){
  const o=ord(payTable),c=calc(o);
  const pm=S.displayState.method||"qr";
  const rec=S.displayState.received||0;
  const changeAmt=Math.max(0,rec-c.total);

  const lines=Object.keys(o.items).map(id=>{
    const m=byId(id),q=o.items[id];
    const st=(o.status&&o.status[id])||"wait";
    const stText=st==="done"?"เสิร์ฟแล้ว":st==="cook"?"กำลังทำ":"รอทำ";
    const stCls=st==="done"?"st-done":st==="cook"?"st-cook":"st-wait";
    return `<div class="ln">
      <span>${m.name} <span class="tag-status ${stCls}">${stText}</span><br><small class="mute">${fmt(m.price)}</small></span>
      <span class="q"><button onclick="chgPayQty(${id},-1)">−</button>${q}<button onclick="chgPayQty(${id},1)">+</button></span>
      <b>${fmt(m.price*q)}</b>
    </div>`;
  }).join("");

  $("v-pay").innerHTML=`
  <div class="split2">
    <section>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">
        <h2 style="margin:0">เลือกโต๊ะที่ต้องการคิดเงิน (ซิงก์ไปจอลูกค้าอัตโนมัติ)</h2>
        <button onclick="openCustomerWindow()" style="min-height:38px;padding:4px 12px;font-size:14px">🖥️ เปิดหน้าต่างจอลูกค้าแยก</button>
      </div>
      <div class="tables">
        ${S.tl.map(t=>{
          const tc=calc(ord(t));
          return `<button class="tb ${t===payTable?"on":""} ${tc.cnt?"busy":""}" onclick="pickPayTable('${t}')">
            <span class="dot"></span>
            <b>${tn(t)}</b>
            <small>${tc.cnt?fmt(tc.total):"ว่าง"}</small>
          </button>`;
        }).join("")}
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h2 style="margin:0">รายการอาหาร ${tn(payTable)}</h2>
          <button onclick="clearPayTable()" ${c.cnt?"":"disabled"} style="min-height:36px;padding:4px 12px;font-size:14px">ล้างบิลโต๊ะนี้</button>
        </div>
        ${lines||'<div class="empty">โต๊ะนี้ยังไม่มีรายการอาหาร</div>'}
      </div>
    </section>

    <aside class="card bill">
      <h2 style="margin:0 0 8px">สรุปคิดเงิน: ${tn(payTable)}</h2>
      <div class="opts"><label for="dsc" style="margin:0">ส่วนลด</label><span class="q" style="gap:4px"><input id="dsc" type="number" min="0" inputmode="decimal" value="${o.disc||0}" onchange="setPayDisc(this.value)" style="width:84px"><select id="dt" onchange="setPayDt(this.value)" style="width:80px"><option value="b" ${o.dt!=="p"?"selected":""}>บาท</option><option value="p" ${o.dt==="p"?"selected":""}>%</option></select></span></div>
      <div class="pct">${[5,10,15,20].map(p=>`<button onclick="quickPayPct(${p})">${p}%</button>`).join("")}<button onclick="setPayDisc(0)">ไม่ลด</button></div>
      <div class="opts"><label for="svc" style="margin:0">ค่าบริการ 10%</label><input id="svc" type="checkbox" ${o.svc?"checked":""} onchange="setPaySvc(this.checked)"></div>
      
      <div class="sum">
        <div><span>รวมเป็นเงิน</span><span>${fmt(c.sub)}</span></div>
        ${c.disc?`<div><span>ส่วนลด${o.dt==="p"?" "+o.disc+"%":""}</span><span>−${fmt(c.disc)}</span></div>`:""}
        ${c.svc?`<div><span>ค่าบริการ 10%</span><span>${fmt(c.svc)}</span></div>`:""}
        ${c.vm==="none"?"":`<div class="mute"><small>VAT 7% ${c.vm==="add"?"(บวกเพิ่ม)":"รวมในราคาแล้ว"}</small><small>${fmt(c.vat)}</small></div>`}
        <div class="tot"><span>ยอดสุทธิ</span><span>${fmt(c.total)}</span></div>
      </div>

      <div style="margin-top:12px">
        <label style="margin-top:0">เลือกวิธีชำระเงิน (แสดงผลบนจอลูกค้าทันที)</label>
        <div class="seg">
          <button class="${pm==="cash"?"on":""}" onclick="setPayMethod('cash')">💵 เงินสด</button>
          <button class="${pm==="qr"?"on":""}" onclick="setPayMethod('qr')">📱 สแกนจ่าย QR</button>
          <button class="${pm==="card"?"on":""}" onclick="setPayMethod('card')">💳 บัตร</button>
        </div>
      </div>

      ${pm==="cash" ? `
        <div style="background:var(--soft);padding:12px;border-radius:12px;margin-bottom:12px">
          <label for="rec-in" style="margin-top:0;color:var(--ink)">รับเงินสดมา (บาท)</label>
          <input id="rec-in" type="number" inputmode="decimal" value="${rec}" onchange="setCashReceived(this.value)" onkeyup="if(event.key==='Enter')setCashReceived(this.value)">
          <div class="quick">
            ${[100,500,1000].map(v=>`<button onclick="setCashReceived(${v})">${v}</button>`).join("")}
            <button onclick="setCashReceived(${Math.ceil(c.total)})">พอดี</button>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
            <span>เงินทอนลูกค้า:</span>
            <b style="font-size:24px;color:var(--ok)">${fmt(changeAmt)}</b>
          </div>
        </div>
      ` : pm==="qr" ? `
        <div style="background:var(--soft);padding:12px;border-radius:12px;margin-bottom:12px;text-align:center">
          <div style="font-weight:600;color:var(--pkd)">กำลังแสดง QR Code บนจอลูกค้า</div>
          <small class="mute">ตรวจสอบสลิปโอนเงินยอด ${fmt(c.total)} ก่อนกดยืนยัน</small>
        </div>
      ` : ""}

function readImg(file,max,type,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");if(type==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(type,.85))};im.src=r.result};r.readAsDataURL(file)}

function addCustCart(id){
  const m=byId(id);
  if(!m||m.soldOut)return;
  custCart[id]=(custCart[id]||0)+1;
  rCust();
}
function chgCustCart(id,d){
  custCart[id]=(custCart[id]||0)+d;
  if(custCart[id]<=0){delete custCart[id];delete custNotes[id]}
  rCust();
}
function noteCustItem(id){
  const m=byId(id);
  const val=prompt(`หมายเหตุถึงครัวสำหรับ "${m.name}" (เช่น ไม่เผ็ด, แยกน้ำ):`,custNotes[id]||"");
  if(val!==null){
    if(val.trim())custNotes[id]=val.trim();
    else delete custNotes[id];
    openCustCartModal();
  }
}

    const q=custCart[m.id]||0;

    </div>`;

  if(cartCount){
    html+=`<div class="cust-bar">
      <div><small class="mute">ตะกร้า (${cartCount} รายการ)</small><div style="font-size:20px;font-weight:600;color:var(--pkd)">${fmt(cartTotal)}</div></div>

  $("box").innerHTML=`<h2>ยืนยันรายการสั่งอาหาร (${tn(CUST_TABLE)})</h2>

  $("modal").hidden=false;
}

function submitCustOrder(){
  const cartIds=Object.keys(custCart);
  if(!cartIds.length)return;
  const btn=$("btn-send");
  if(btn && btn.disabled)return;
  if(btn){btn.disabled=true;btn.textContent="กำลังส่ง..."}

  const applyOrder=(curr)=>{
    const o=curr||{items:{},disc:0,svc:false,notes:{},status:{}};
    o.items=o.items||{};
    o.notes=o.notes||{};
    o.status=o.status||{};
    if(!o.start)o.start=new Date().toISOString();
    cartIds.forEach(id=>{
      o.items[id]=(o.items[id]||0)+custCart[id];
      o.status[id]="wait";
      if(custNotes[id]){
        o.notes[id]=o.notes[id]?(o.notes[id]+", "+custNotes[id]):custNotes[id];
      }
    });
    return o;
  };

  const finish=()=>{
    custCart={};
    custNotes={};
    rCust();
    $("box").innerHTML=`<div style="text-align:center;padding:16px 0">
      <div style="font-size:48px;color:var(--ok)">✓</div>
      <h2>ส่งรายการอาหารเข้าครัวแล้ว!</h2>
      <p class="mute">ออเดอร์ของ ${tn(CUST_TABLE)} ถูกส่งไปยังหน้าจอในครัวเรียบร้อย</p>
      <button class="pri" style="width:100%;margin-top:12px" onclick="closeM()">ตกลง</button>
    </div>`;
    $("modal").hidden=false;
  };

  // ใช้ Transaction ตัวเดียวเมื่อออนไลน์ Firebase (ไม่บวกซ้ำใน S.orders ก่อน ป้องกันสั่ง 1 ไป 2)
  if(fbOn&&fb){
    fb.ref("orders/"+CUST_TABLE).transaction(curr=>applyOrder(curr))
      .then(()=>finish())
      .catch(()=>{
        if(btn){btn.disabled=false;btn.textContent="ยืนยันส่งเข้าครัว"}
        alert("เกิดข้อผิดพลาดในการส่งรายการ กรุณากดยืนยันอีกครั้ง");
      });
  }else{
    S.orders[CUST_TABLE]=applyOrder(S.orders[CUST_TABLE]);
    save();
    finish();
  }
}

/* ==================== ยืนยันรับเงิน & พิมพ์ใบเสร็จ ==================== */
function doPay(id){
  const o=ord(payTable),c=calc(o);
  const pm=S.displayState.method||"qr";
  const r=pm==="cash"?(S.displayState.received||c.total):c.total;
  const now=new Date().toISOString();
  const s={
    id:id||S.seq++,
    k:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    time:now,
    start:o.start||now,
    table:payTable,
    method:pm,
    received:r,
    change:Math.max(0,r-c.total),
    items:Object.keys(o.items).map(id=>{const m=byId(id);return{name:m.name,qty:o.items[id],price:m.price,cost:m.cost}}),
    ...c,
    profit:c.sub-c.disc-c.cost,
    dl:o.dt==="p"?o.disc+"%":""
  };
  S.seq=Math.max(S.seq,s.id+1);
  S.sales.push(s);
  delete S.orders[payTable];
  S.displayState.paidSuccess=true;
  save();
  rPay();
  receipt(s);
}

function pickLogo(el){const f=el.files[0];if(f)readImg(f,240,"image/png",d=>{S.shop.logo=d;save();hdr();rMgr()})}
function rmLogo(){S.shop.logo="";save();hdr();rMgr()}
function pickPayQr(el){const f=el.files[0];if(f)readImg(f,420,"image/png",d=>{S.shop.payQr=d;save();rMgr()})}
function rmPayQr(){S.shop.payQr="";save();rMgr()}
function renameT(t,v){v=v.trim();if(v)S.tnames[t]=v;else delete S.tnames[t];save();rMgr()}
function addT(){const id="x"+S.tid++,k=S.tl.indexOf("T");S.tl.splice(k<0?S.tl.length:k,0,id);S.tnames[id]="โต๊ะ "+S.tl.length;save();rMgr()}
function delT(t){S.tl=S.tl.filter(x=>x!==t);delete S.tnames[t];delete S.orders[t];if(ordTable===t)ordTable=S.tl[0];if(payTable===t)payTable=S.tl[0];save();rMgr()}
function askDel(id){if(delId!==id){delId=id;rMgr();return}
S.menu=S.menu.filter(m=>m.id!==id);for(const t in S.orders)delete S.orders[t].items[id];delId=0;save();rMgr()}

/* ==================== 6. รายงาน & สรุปยอดประจำวันสำหรับบัญชี / DBD ==================== */
const PER=[["เช้า 06–11",6,11],["กลางวัน 11–14",11,14],["บ่าย 14–17",14,17],["เย็น 17–21",17,21],["ค่ำ–ดึก 21–06",21,30]];
function inRange(s){const d=new Date(s.time),n=new Date();
if(range==="day")return d.toDateString()===n.toDateString();
if(range==="week")return n-d<7*864e5;
if(range==="month")return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();return true}
function setRange(r){range=r;rRep()}

function rRep(){
  const L=S.sales.filter(inRange),sum=k=>L.reduce((a,s)=>a+(s[k]||0),0);
  const rev=sum("total"),cost=sum("cost"),profit=sum("profit"),vatTotal=sum("vat");
  const avgBill=L.length?rev/L.length:0;
  const by={cash:0,qr:0,card:0},it={},pb=PER.map(()=>({n:0,t:0}));
  const dailyMap={};

  L.forEach(s=>{
    by[s.method]=(by[s.method]||0)+s.total;
    let h=new Date(s.time).getHours();if(h<6)h+=24;
    const k=PER.findIndex(p=>h>=p[1]&&h<p[2]);
    if(k>=0){pb[k].n++;pb[k].t+=s.total}
    s.items.forEach(i=>{
      const x=it[i.name]||(it[i.name]={q:0,r:0,p:0});
      x.q+=i.qty;x.r+=i.price*i.qty;x.p+=(i.price-(i.cost||0))*i.qty;
    });
    const dKey=new Date(s.time).toLocaleDateString("th-TH",{year:"numeric",month:"short",day:"numeric"});
    if(!dailyMap[dKey])dailyMap[dKey]={bills:0,rev:0,cost:0,profit:0,vat:0};
    dailyMap[dKey].bills++;
    dailyMap[dKey].rev+=s.total;
    dailyMap[dKey].cost+=(s.cost||0);
    dailyMap[dKey].profit+=(s.profit||0);
    dailyMap[dKey].vat+=(s.vat||0);
  });

  const tops=Object.entries(it).sort((a,b)=>b[1].p-a[1].p).slice(0,8),mx=Math.max(1,...pb.map(p=>p.t));
  const durs=L.map(s=>(new Date(s.time)-new Date(s.start))/6e4),avgD=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):0;
  const dailyRows=Object.entries(dailyMap).reverse();

  $("v-rep").innerHTML=`
    <div class="seg" style="max-width:520px">${[["day","วันนี้"],["week","7 วัน"],["month","เดือนนี้"],["all","ทั้งหมด"]].map(([k,l])=>`<button class="${k===range?"on":""}" onclick="setRange('${k}')">${l}</button>`).join("")}</div>
    
    <div class="stats">
      <div class="stat"><span class="mute">ยอดขายรวม</span><b>${fmt(rev)}</b></div>
      <div class="stat"><span class="mute">ต้นทุนวัตถุดิบ</span><b>${fmt(cost)}</b></div>
      <div class="stat"><span class="mute">กำไรขั้นต้น</span><b class="${profit>=0?"up":"dn"}">${fmt(profit)}</b></div>
      <div class="stat"><span class="mute">เฉลี่ยต่อบิล</span><b>${fmt(avgBill)}</b></div>
      <div class="stat"><span class="mute">จำนวนบิล / นั่งเฉลี่ย</span><b>${L.length} บิล (${avgD} น.)</b></div>
    </div>

    <div class="card" style="margin-top:16px;overflow-x:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2 style="margin:0">ตารางสรุปยอดรายวัน (สำหรับบัญชี / DBD)</h2>
        <small class="mute">ภาษี VAT รวม: ${fmt(vatTotal)}</small>
      </div>
      <table class="tbl">
        <tr><th>วันที่</th><th>จำนวนบิล</th><th>ยอดขายสุทธิ</th><th>ต้นทุน</th><th>กำไรขั้นต้น</th><th>เฉลี่ย/บิล</th></tr>
        ${dailyRows.map(([dt,d])=>`
          <tr>
            <td>${dt}</td>
            <td>${d.bills}</td>
            <td><b>${fmt(d.rev)}</b></td>
            <td>${fmt(d.cost)}</td>
            <td class="${d.profit>=0?"up":"dn"}">${fmt(d.profit)}</td>
            <td>${fmt(d.bills?d.rev/d.bills:0)}</td>
          </tr>
        `).join("")||'<tr><td colspan="6" class="empty">ยังไม่มียอดขายในช่วงเวลานี้</td></tr>'}
      </table>
    </div>

    <div class="cols">
      <div class="card"><h2>ช่วงเวลาที่ลูกค้าเข้าใช้บริการ</h2>${PER.map((p,k)=>`<div><div class="ln two" style="border:0;padding:4px 0 0"><span>${p[0]}</span><span>${pb[k].n} บิล ${fmt(pb[k].t)}</span></div><div class="bar"><i style="width:${pb[k].t/mx*100}%"></i></div></div>`).join("")}</div>
      <div class="card"><h2>ช่องทางชำระเงิน</h2>${[["เงินสด","cash"],["PromptPay","qr"],["บัตร","card"]].map(([l,k])=>`<div class="ln two"><span>${l}</span><b>${fmt(by[k])}</b></div>`).join("")}</div>
      <div class="card"><h2>กำไรแยกตามเมนู</h2><table class="tbl"><tr><th>เมนู</th><th>ขาย</th><th>ยอด</th><th>กำไร</th></tr>${tops.map(([n,x])=>`<tr><td>${n}</td><td>${x.q}</td><td>${fmt(x.r)}</td><td class="${x.p>=0?"up":"dn"}">${fmt(x.p)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">ยังไม่มียอดขายในช่วงนี้</td></tr>'}</table></div>
      <div class="card"><h2>บิลล่าสุด</h2>${L.slice(-10).reverse().map(s=>`<div class="ln two"><span>${pid(s.id)} ${tn(s.table)}<br><small class="mute">เข้า ${hm(s.start)} ออก ${hm(s.time)} (${Math.max(1,Math.round((new Date(s.time)-new Date(s.start))/6e4))} นาที)</small></span><span style="text-align:right">${fmt(s.total)}<br><button style="min-height:34px;padding:2px 10px" onclick="showBill(${s.id})">ใบเสร็จ</button></span></div>`).join("")||'<div class="empty">ยังไม่มีบิล</div>'}</div>
    </div>
    <div class="row" style="max-width:280px"><button id="wp" onclick="wipeAll()">ล้างข้อมูลยอดขายทั้งหมด</button></div>`;
}

function refreshLater(){
  clearTimeout(rt);
  rt=setTimeout(()=>{
    if(IS_CUST){render();return}
    S.sales.sort((a,b)=>a.id-b.id);
    try{localStorage.setItem('pos-v2',JSON.stringify(S))}catch(e){}
    const a=document.activeElement;
    if(!S.tl.includes(ordTable))ordTable=S.tl[0];
    if(!S.tl.includes(payTable))payTable=S.tl[0];
    updateKdsBadge();
    if(IS_DISP_WINDOW){rDisp();return}
    if(curTab==="ord")rOrd();
    else if(curTab==="kds")rKds();
    else if(curTab==="pay"){if(!(a&&a.tagName==='INPUT'))rPay()}
    else if(curTab==="disp")rDisp();
    else if(curTab==="menu"){if(!(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')))rMgr()}
    else if(curTab==="rep")rRep();
  },120);
}

function fbPush(){
  if(!fbOn||IS_CUST)return;
  SK.forEach(k=>{if(last[k]===undefined)return;const j=JSON.stringify(S[k]);if(last[k]!==j){last[k]=j;fb.ref(k).set(clean(S[k]))}});
  for(const t in S.orders){const o=S.orders[t],h=Object.keys(o.items).length,j=h?JSON.stringify(o):'';if((last['o:'+t]||'')!==j){last['o:'+t]=j;fb.ref('orders/'+t).set(h?clean(o):null)}}
  Object.keys(last).forEach(k=>{if(k.startsWith('o:')&&last[k]&&!S.orders[k.slice(2)]){last[k]='';fb.ref('orders/'+k.slice(2)).set(null)}});
  const ks=new Set();S.sales.forEach(s=>{if(!s.k)s.k='s'+s.id+'_'+Math.random().toString(36).slice(2,6);ks.add('s:'+s.k);if(!last['s:'+s.k]){last['s:'+s.k]=1;fb.ref('sales/'+s.k).set(clean(s))}});
  Object.keys(last).forEach(k=>{if(k.startsWith('s:')&&!ks.has(k)){delete last[k];fb.ref('sales/'+k.slice(2)).set(null)}});
}

/* ซิงก์สำหรับหน้าจอมือถือลูกค้า (?table=X) */
function startCustSync(){
  if(fbOn)return;fbOn=true;
  fb.ref('.info/connected').on('value',s=>{$('sync').textContent=s.val()?'● พร้อมสั่งอาหาร':'○ ออฟไลน์'});
  ['menu','shop','tnames'].forEach(k=>fb.ref(k).on('value',sn=>{
    const v=sn.val();
    if(v!=null){S[k]=k==='shop'?Object.assign({name:'',info:'',pw:80,logo:'',payQr:'',vat:'in'},v):v;refreshLater()}
  }));
  fb.ref('orders/'+CUST_TABLE).on('value',sn=>{
    const v=sn.val();
    if(v){v.items=v.items||{};v.notes=v.notes||{};v.status=v.status||{};S.orders[CUST_TABLE]=v}else{delete S.orders[CUST_TABLE]}
    refreshLater();
  });
}

function startSync(){
  if(fbOn)return;fbOn=true;fbPush();
  fb.ref('.info/connected').on('value',s=>{$('sync').textContent=s.val()?'● ซิงก์ออนไลน์ทุกเครื่องแล้ว':'○ ออฟไลน์'});
  fb.ref('seq').transaction(n=>n==null?S.seq-1:n);
  SK.forEach(k=>fb.ref(k).on('value',sn=>{
    let v=sn.val();
    if(v==null){
      if(k==='tnames'){S.tnames={};last[k]='{}'}
      else if(S[k]!==undefined){last[k]=JSON.stringify(S[k]);fb.ref(k).set(clean(S[k]))}
      return;
    }
    if(k==='shop')v=Object.assign({name:'',info:'',pw:80,logo:'',payQr:'',vat:'in'},v);
    if(k==='displayState'&&v.table)payTable=v.table;
    S[k]=v;last[k]=JSON.stringify(v);refreshLater();
  }));
  fb.ref('orders').on('value',sn=>{
    const v=sn.val()||{};
    for(const t in S.orders)if(!v[t]&&Object.keys(S.orders[t].items).length){delete S.orders[t];delete last['o:'+t]}
    for(const t in v){const o=v[t];o.items=o.items||{};o.disc=o.disc||0;o.svc=!!o.svc;o.notes=o.notes||{};o.status=o.status||{};S.orders[t]=o;last['o:'+t]=JSON.stringify(o)}
    refreshLater();
  });
  const sr=fb.ref('sales').limitToLast(2000);
  sr.on('child_added',sn=>{const s=sn.val();s.k=sn.key;last['s:'+s.k]=1;if(!S.sales.some(x=>x.k===s.k))S.sales.push(s);refreshLater()});
  sr.on('child_removed',sn=>{S.sales=S.sales.filter(x=>x.k!==sn.key);delete last['s:'+sn.key];refreshLater()});
}

function confirmPay(){
  if(!fbOn)return doPay(0);
  let done=false;
  const go=id=>{if(!done){done=true;doPay(id)}};
  fb.ref('seq').transaction(n=>(n||0)+1).then(r=>go(r.snapshot.val()),()=>go(0));
  setTimeout(()=>go(0),3000);
}
function wipeAll(){if(!wipe){wipe=true;$("wp").textContent="กดอีกครั้งเพื่อยืนยัน";return}
S.sales=[];S.orders={};S.seq=1;save();wipe=false;rRep()}

if(IS_CUST){
  $("main-nav").hidden=true;
  $("v-ord").hidden=true;
  $("v-cust").hidden=false;
}else if(IS_DISP_WINDOW){
  $("main-nav").hidden=true;
  tab('disp');
}
window.addEventListener("storage",e=>{if(e.key==="pos-v2"&&e.newValue){try{S=Object.assign(S,JSON.parse(e.newValue));refreshLater()}catch(err){}}});
render();
</script>
</body>
</html>
